name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed bats shellcheck actionlint make git diffutils
      - uses: actions/checkout@v4
      # The CLI refuses to run as root, as on a real system, so the tests run as a normal user.
      - name: Lint and test
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'make check'
